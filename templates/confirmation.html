<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coat Logged</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="screen screen-centered">
        <p class="checkmark">&#10003;</p>
        <h1>Coat logged</h1>
        <p class="subheading">{{ job.vessel_name }} &middot; {{ job.job_number }} &middot; {{ job.area }}</p>

        <a href="{{ url_for('log_coat_form', job_id=job.id) }}" class="btn-primary">Log another coat</a>
        <a href="{{ url_for('start') }}" class="btn-secondary">Return to start</a>
    </main>
</body>
</html>
