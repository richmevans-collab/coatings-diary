<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log a Coat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="screen">
        <h1>Log a Coat</h1>
        <p class="subheading">{{ job.vessel_name }} &middot; {{ job.job_number }} &middot; {{ job.area }}</p>

        <form method="post" action="{{ url_for('submit_coat', job_id=job.id) }}" enctype="multipart/form-data">

            <label for="coat_number">Coat Number</label>
            <select id="coat_number" name="coat_number" required>
                <option value="1">Coat 1</option>
                <option value="2">Coat 2</option>
                <option value="3">Coat 3</option>
                <option value="4">Coat 4</option>
            </select>

            <label for="humidity">Humidity (%)</label>
            <input type="number" id="humidity" name="humidity" inputmode="decimal" step="0.1" min="0" max="100" required>

            <label for="air_temp">Air Temp (&deg;C)</label>
            <input type="number" id="air_temp" name="air_temp" inputmode="decimal" step="0.1" required>

            <label for="surface_temp">Surface Temp (&deg;C)</label>
            <input type="number" id="surface_temp" name="surface_temp" inputmode="decimal" step="0.1" required>

            <label for="product_name">Product Name</label>
            <input type="text" id="product_name" name="product_name" placeholder="e.g. Intergard 269">

            <label for="wft">WFT (microns)</label>
            <input type="number" id="wft" name="wft" inputmode="decimal" step="1" min="0">

            <label for="tin_photo" class="photo-label">Photo of Tin (optional)</label>
            <input type="file" id="tin_photo" name="tin_photo" accept="image/*" capture="environment" class="photo-input">

            <button type="submit" class="btn-primary btn-sticky">Submit</button>
        </form>
    </main>
</body>
</html>
